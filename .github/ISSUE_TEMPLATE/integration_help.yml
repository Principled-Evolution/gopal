name: Integration help or question
description: Ask how to wire GOPAL into your stack, or which policies apply to your AI system.
title: "[help] "
labels: ["question", "integration"]
body:
  - type: markdown
    attributes:
      value: |
        You don't need to know Rego, OPA, or GitHub conventions to use this form.
        Fill in what you know and leave the rest blank. We would much rather
        answer a rough question than have you not ask it.

        If you would prefer email, write to **gopal@principledevolution.ai**.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of help do you need?
      options:
        - "I'm not sure which framework or policies apply to my AI system"
        - "I can't work out what input JSON my system needs to produce"
        - "I'm trying to run GOPAL in CI (GitHub Actions, GitLab, Jenkins)"
        - "I'm trying to run GOPAL against a live OPA server or sidecar"
        - "I want to combine GOPAL with my own internal policies"
        - "I'm evaluating GOPAL and have questions about scope or maturity"
        - "The output or report format isn't what I expected"
        - "Something else"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to achieve?
      description: A few sentences in your own words. What system are you governing, and what would a good answer let you do?
      placeholder: |
        We run a credit-decisioning model and our auditors want evidence that we
        check for disparate impact before every release. We would like that check
        to run in CI rather than in a spreadsheet.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried so far?
      description: Commands you ran, docs you read, policies you looked at. Paste any error output.
      render: shell
    validations:
      required: false

  - type: input
    id: framework
    attributes:
      label: Which regulation or framework matters most to you?
      description: For example the EU AI Act, NIST AI RMF, FERPA, EASA, or "not sure yet".
      placeholder: EU AI Act
    validations:
      required: false

  - type: dropdown
    id: stage
    attributes:
      label: Where are you in the process?
      options:
        - "Just exploring, reading the README"
        - "Ran the 30-second Quick Start"
        - "Piloting GOPAL on a real system"
        - "Running GOPAL in production or in an audit workflow"
    validations:
      required: false

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OPA version, OS, and how you are invoking GOPAL. Only if it's relevant.
      placeholder: |
        opa 1.x, Ubuntu 24.04, invoked from a GitHub Actions job
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before you post
      options:
        - label: I looked at the [coverage matrices](https://github.com/Principled-Evolution/gopal/tree/main/docs/coverage) and the [FAQ](https://github.com/Principled-Evolution/gopal/blob/main/docs/FAQ.md)
          required: false
        - label: This is not a security vulnerability (those go to security@principledevolution.ai, see [SECURITY.md](https://github.com/Principled-Evolution/gopal/blob/main/.github/SECURITY.md))
          required: true
