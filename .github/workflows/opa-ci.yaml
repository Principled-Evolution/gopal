name: OPA Policies CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  opa-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Both tools are pinned. They used to install `latest`, which meant an
      # upstream release could turn this build red with no change on our side,
      # and on 2026-08-28 one did: OPA 1.20.0 panicked on any ordering
      # comparison against a decimal zero, which four helpers in
      # global/v1/common use as a score fallback.
      #
      # That is fixed in 1.20.1, which exists for the fix we submitted
      # (open-policy-agent/opa#9099). Verified before raising this pin: the
      # panic is gone, all 144 comparisons in the grid from the bug report
      # agree with 1.19.1, and the suite passes 806/806.
      #
      # The pin stays because pinning is right, not because 1.20.0 was broken.
      - name: Install OPA
        env:
          OPA_VERSION: v1.20.1
        run: |
          curl -L -o opa "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64"
          chmod 755 opa
          sudo mv opa /usr/local/bin/
          opa version

      - name: Install Regal
        env:
          REGAL_VERSION: v0.42.0
        run: |
          curl -L -o regal "https://github.com/open-policy-agent/regal/releases/download/${REGAL_VERSION}/regal_Linux_x86_64"
          chmod +x regal
          sudo mv regal /usr/local/bin/
          regal version

      - name: Run OPA Check
        run: opa check --ignore custom/ --ignore dist .
        working-directory: ${{ github.workspace }}

      - name: Run Regal Lint
        run: regal lint --ignore-files custom/ .
        working-directory: ${{ github.workspace }}

      # The YAML and JSON ignores keep `opa test` from trying to load issue
      # templates and example inputs as data documents.
      - name: Run OPA Tests
        run: opa test --ignore custom/ --ignore dist --ignore '*.yml' --ignore '*.yaml' --ignore '*.json' .
        working-directory: ${{ github.workspace }}

      # docs/coverage/coverage.json is generated from the .rego files. This step
      # fails if it was not regenerated after a policy changed, which is what
      # stops the coverage figures drifting away from the code again.
      - name: Check coverage data is current
        run: scripts/generate-coverage.sh --check
        working-directory: ${{ github.workspace }}

      # The README's "Jump to" nav points at its own headings. A nav whose
      # targets have been renamed is worse than no nav: it looks maintained and
      # lands the reader nowhere.
      # Reports deprecation status during normal development, and fails only
      # when a major release is cut while matured deprecations remain. The timer
      # is data in the alias table rather than something to remember.
      - name: Check the deprecation timer
        run: scripts/check-deprecations.sh
        working-directory: ${{ github.workspace }}

      - name: Check in-document anchors resolve
        run: scripts/check-anchors.sh
        working-directory: ${{ github.workspace }}

      # CONTRIBUTING.md has always required a sibling test and an empty-input
      # test per policy, and nothing enforced it: the gap reached 22 of 96
      # policies, including both Article 5 prohibited-practice policies. An
      # external reviewer flipped `default allow := false` to `true` in the
      # social-scoring gate and the suite still reported 604/604.
      - name: Check every policy has a test and an empty-input test
        run: scripts/check-test-coverage.sh
        working-directory: ${{ github.workspace }}

      # The version appears in seven hand-maintained places, including a README
      # command people are told to run. v1.2.0 shipped that command pointing at
      # a release with no assets, and nothing caught it.
      - name: Check version references and published counts
        run: scripts/check-version-refs.sh
        working-directory: ${{ github.workspace }}

      # The published claim that a model card answers 8 of 184 declared facts
      # has to stay checkable. This regenerates the analysis and fails if the
      # committed document is stale, or if the classification names a field no
      # policy reads any more.
      - name: Check the model-card coverage analysis is current
        run: scripts/model-card-coverage.sh --check
        working-directory: ${{ github.workspace }}

      # The playground ships curated sample inputs and claims they produce a
      # specific verdict for every policy. --verify evaluates each one and fails
      # if a policy changed meaning, which is the only thing that stops the
      # samples drifting the way the coverage figures once did.
      - name: Build playground artefacts and verify sample verdicts
        run: scripts/build-playground.sh --verify
        working-directory: ${{ github.workspace }}
# CI trigger
