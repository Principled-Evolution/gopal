[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gopal"
version = "2.0.0"
description = "GOPAL - the Rego policy library for AI compliance. AI compliance rules you can read, run, diff, and prove, covering the EU AI Act, the UK AI framework, NIST AI RMF, aviation, financial services, education, healthcare, and legal practice. Per-article coverage matrices state what is implemented and what is not."
readme = "README.md"
authors = [
    {name = "Principled Evolution", email = "info@principledevolution.ai"},
    {name = "Mantric", email = "info@mantric.com"},
]
license = "Apache-2.0"
keywords = [
    "ai-governance",
    "ai-compliance",
    "ai-act",
    "eu-ai-act",
    "nist-ai-rmf",
    "open-policy-agent",
    "opa",
    "rego",
    "policy-as-code",
    "regulatory-compliance",
    "aviation-safety",
    "ferpa",
    "coppa",
    "fair-lending",
    "responsible-ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.8"
dependencies = [
    "opa-python>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Principled-Evolution/gopal"
Repository = "https://github.com/Principled-Evolution/gopal"
Documentation = "https://github.com/Principled-Evolution/gopal#readme"
Issues = "https://github.com/Principled-Evolution/gopal/issues"
Changelog = "https://github.com/Principled-Evolution/gopal/blob/main/CHANGELOG.md"
"Consumer (AICertify)" = "https://github.com/Principled-Evolution/aicertify"

[tool.setuptools]
packages = ["gopal"]

[tool.setuptools.package-data]
gopal = ["**/*.rego"]
