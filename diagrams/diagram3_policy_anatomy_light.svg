<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title>Anatomy of a GOPAL policy</title>
<desc>Stylized Rego policy file showing package path, imports, metadata, default deny, allow rule, and report composition.</desc>
<defs><clipPath id="pcL"><rect x="60" y="20" width="260" height="380" rx="8"/></clipPath></defs>

<rect x="60" y="20" width="260" height="380" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
<g clip-path="url(#pcL)"><rect x="60" y="20" width="260" height="36" fill="#1e293b"/></g>
<circle cx="76" cy="38" r="4" fill="#ef4444"/>
<circle cx="90" cy="38" r="4" fill="#f59e0b"/>
<circle cx="104" cy="38" r="4" fill="#10b981"/>
<text x="180" y="42" font-size="10" fill="#cbd5e1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">transparency.rego</text>

<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" xml:space="preserve">
<text x="76" y="80"><tspan fill="#7c3aed">package</tspan><tspan fill="#0f172a"> international.eu_ai_act.v1</tspan></text>
<text x="76" y="94" fill="#0f172a">  .transparency</text>

<text x="76" y="120"><tspan fill="#7c3aed">import</tspan><tspan fill="#0f172a"> data.helper_functions</tspan></text>
<text x="76" y="134" fill="#0f172a">  .reporting</text>

<text x="76" y="162" fill="#94a3b8"># METADATA</text>
<text x="76" y="176" fill="#94a3b8"># title: Transparency for GPAI</text>
<text x="76" y="190" fill="#94a3b8"># description: Article 53 ...</text>

<text x="76" y="218"><tspan fill="#7c3aed">default</tspan><tspan fill="#0f172a"> allow := </tspan><tspan fill="#dc2626">false</tspan></text>

<text x="76" y="246"><tspan fill="#0f172a">allow </tspan><tspan fill="#7c3aed">if</tspan><tspan fill="#0f172a"> {</tspan></text>
<text x="76" y="260" fill="#0f172a">  input.system.docs_published</text>
<text x="76" y="274" fill="#0f172a">  input.system.training_summary</text>
<text x="76" y="288" fill="#0f172a">}</text>

<text x="76" y="316" fill="#0f172a">report := reporting</text>
<text x="76" y="330" fill="#0f172a">  .compose_report(</text>
<text x="76" y="344"><tspan fill="#0f172a">    </tspan><tspan fill="#16a34a">"eu_ai_act.transparency"</tspan><tspan fill="#0f172a">,</tspan></text>
<text x="76" y="358" fill="#0f172a">    allow,</text>
<text x="76" y="372" fill="#0f172a">    [...]</text>
<text x="76" y="386" fill="#0f172a">)</text>
</g>

<line x1="320" y1="86" x2="345" y2="86" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle cx="350" cy="86" r="3" fill="#4f46e5"/>
<text x="362" y="84" font-size="13" font-weight="500" fill="#0f172a">Package path</text>
<text x="362" y="100" font-size="11" fill="#64748b">Versioned namespace, mirrors directory</text>

<line x1="320" y1="125" x2="345" y2="125" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle cx="350" cy="125" r="3" fill="#4f46e5"/>
<text x="362" y="123" font-size="13" font-weight="500" fill="#0f172a">Imports</text>
<text x="362" y="139" font-size="11" fill="#64748b">Shared helpers from helper_functions/</text>

<line x1="320" y1="176" x2="345" y2="176" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle cx="350" cy="176" r="3" fill="#4f46e5"/>
<text x="362" y="174" font-size="13" font-weight="500" fill="#0f172a">METADATA</text>
<text x="362" y="190" font-size="11" fill="#64748b">Audit-readable; consumed by tooling</text>

<line x1="320" y1="218" x2="345" y2="218" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle cx="350" cy="218" r="3" fill="#4f46e5"/>
<text x="362" y="216" font-size="13" font-weight="500" fill="#0f172a">Default deny</text>
<text x="362" y="232" font-size="11" fill="#64748b">Safe by default if rule never fires</text>

<line x1="320" y1="262" x2="345" y2="262" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle cx="350" cy="262" r="3" fill="#4f46e5"/>
<text x="362" y="260" font-size="13" font-weight="500" fill="#0f172a">Allow condition</text>
<text x="362" y="276" font-size="11" fill="#64748b">The actual compliance check</text>

<line x1="320" y1="344" x2="345" y2="344" stroke="#cbd5e1" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle cx="350" cy="344" r="3" fill="#d97706"/>
<text x="362" y="342" font-size="13" font-weight="500" fill="#0f172a">Report</text>
<text x="362" y="358" font-size="11" fill="#92400e">Standardized output the auditor reads</text>
</svg>
