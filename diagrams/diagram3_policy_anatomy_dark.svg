<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
<title>Anatomy of a GOPAL policy</title>
<desc>Stylized Rego policy file showing package path, imports, metadata, default deny, allow rule, and report composition.</desc>
<defs><clipPath id="pcD"><rect x="60" y="20" width="260" height="380" rx="8"/></clipPath></defs>

<rect x="60" y="20" width="260" height="380" rx="8" fill="#161b22" stroke="#30363d"/>
<g clip-path="url(#pcD)"><rect x="60" y="20" width="260" height="36" fill="#21262d"/></g>
<circle cx="76" cy="38" r="4" fill="#ef4444"/>
<circle cx="90" cy="38" r="4" fill="#f59e0b"/>
<circle cx="104" cy="38" r="4" fill="#10b981"/>
<text x="180" y="42" font-size="10" fill="#8b949e" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">transparency.rego</text>

<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" xml:space="preserve">
<text x="76" y="80"><tspan fill="#a78bfa">package</tspan><tspan fill="#e2e8f0"> international.eu_ai_act.v1</tspan></text>
<text x="76" y="94" fill="#e2e8f0">  .transparency</text>

<text x="76" y="120"><tspan fill="#a78bfa">import</tspan><tspan fill="#e2e8f0"> data.helper_functions</tspan></text>
<text x="76" y="134" fill="#e2e8f0">  .reporting</text>

<text x="76" y="162" fill="#6e7681"># METADATA</text>
<text x="76" y="176" fill="#6e7681"># title: Transparency for GPAI</text>
<text x="76" y="190" fill="#6e7681"># description: Article 53 ...</text>

<text x="76" y="218"><tspan fill="#a78bfa">default</tspan><tspan fill="#e2e8f0"> allow := </tspan><tspan fill="#f87171">false</tspan></text>

<text x="76" y="246"><tspan fill="#e2e8f0">allow </tspan><tspan fill="#a78bfa">if</tspan><tspan fill="#e2e8f0"> {</tspan></text>
<text x="76" y="260" fill="#e2e8f0">  input.system.docs_published</text>
<text x="76" y="274" fill="#e2e8f0">  input.system.training_summary</text>
<text x="76" y="288" fill="#e2e8f0">}</text>

<text x="76" y="316" fill="#e2e8f0">report := reporting</text>
<text x="76" y="330" fill="#e2e8f0">  .compose_report(</text>
<text x="76" y="344"><tspan fill="#e2e8f0">    </tspan><tspan fill="#4ade80">"eu_ai_act.transparency"</tspan><tspan fill="#e2e8f0">,</tspan></text>
<text x="76" y="358" fill="#e2e8f0">    allow,</text>
<text x="76" y="372" fill="#e2e8f0">    [...]</text>
<text x="76" y="386" fill="#e2e8f0">)</text>
</g>

<line x1="320" y1="86" x2="345" y2="86" stroke="#30363d" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle cx="350" cy="86" r="3" fill="#a5b4fc"/>
<text x="362" y="84" font-size="13" font-weight="500" fill="#f0f6fc">Package path</text>
<text x="362" y="100" font-size="11" fill="#8b949e">Versioned namespace, mirrors directory</text>

<line x1="320" y1="125" x2="345" y2="125" stroke="#30363d" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle cx="350" cy="125" r="3" fill="#a5b4fc"/>
<text x="362" y="123" font-size="13" font-weight="500" fill="#f0f6fc">Imports</text>
<text x="362" y="139" font-size="11" fill="#8b949e">Shared helpers from helper_functions/</text>

<line x1="320" y1="176" x2="345" y2="176" stroke="#30363d" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle cx="350" cy="176" r="3" fill="#a5b4fc"/>
<text x="362" y="174" font-size="13" font-weight="500" fill="#f0f6fc">METADATA</text>
<text x="362" y="190" font-size="11" fill="#8b949e">Audit-readable; consumed by tooling</text>

<line x1="320" y1="218" x2="345" y2="218" stroke="#30363d" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle cx="350" cy="218" r="3" fill="#a5b4fc"/>
<text x="362" y="216" font-size="13" font-weight="500" fill="#f0f6fc">Default deny</text>
<text x="362" y="232" font-size="11" fill="#8b949e">Safe by default if rule never fires</text>

<line x1="320" y1="262" x2="345" y2="262" stroke="#30363d" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle cx="350" cy="262" r="3" fill="#a5b4fc"/>
<text x="362" y="260" font-size="13" font-weight="500" fill="#f0f6fc">Allow condition</text>
<text x="362" y="276" font-size="11" fill="#8b949e">The actual compliance check</text>

<line x1="320" y1="344" x2="345" y2="344" stroke="#30363d" stroke-width="0.5" stroke-dasharray="3 3"/>
<circle cx="350" cy="344" r="3" fill="#fbbf24"/>
<text x="362" y="342" font-size="13" font-weight="500" fill="#f0f6fc">Report</text>
<text x="362" y="358" font-size="11" fill="#fcd34d">Standardized output the auditor reads</text>
</svg>
